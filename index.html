<!doctype html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            900: '#020305',
                            800: '#070a14',
                            700: '#0f172a',
                            neon: '#00ffcc',
                            purple: '#9d00ff',
                            pink: '#ff007f'
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00ffcc33; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffcc; }
        .glass-card {
            background: rgba(7, 10, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.15);
        }
        .glass-card:hover {
            border-color: rgba(0, 255, 204, 0.5);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6), 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .not-found-box {
            border: 1px dashed rgba(255, 0, 127, 0.3);
            background: rgba(255, 0, 127, 0.03);
        }
        .entrance-hidden {
            opacity: 0;
            transform: translateY(30px);
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        #security-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #020305;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .console-log-box {
            background: rgba(2, 3, 5, 0.95);
            border: 1px solid rgba(0, 255, 204, 0.2);
            font-family: 'JetBrains Mono', monospace;
            max-height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-cyber-900 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyber-neon selection:text-cyber-900">

    <div id="security-gate">
        <div class="max-w-lg w-full mx-4 p-6 rounded-2xl glass-card border border-cyber-neon/40 relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-0 w-full h-1 bg-cyber-neon animate-pulse"></div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-cyber-neon/10 border border-cyber-neon/30 flex items-center justify-center text-cyber-neon">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-base font-bold text-white font-mono neon-glow">anti-ddos</h2>
                    <p class="text-[11px] text-slate-400 font-mono">Đang kiểm tra bảo mật thời gian thực (5 giây)...</p>
                </div>
            </div>

            <div class="console-log-box p-3 rounded-lg mb-4 text-[11px] space-y-1 text-slate-300" id="security-log-container">
            </div>

            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-3 border border-slate-700">
                <div id="security-progress" class="bg-cyber-neon h-full w-0 transition-all duration-300 shadow-[0_0_15px_#00ffcc]"></div>
            </div>
            <div class="flex justify-between items-center text-[10px] font-mono text-slate-500">
                <span id="security-status-text">Đang khởi tạo...</span>
                <span id="security-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="fixed top-4 right-4 z-40 flex items-center gap-3">
        <button onclick="scrollToSection('info-detailed-section')" 
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card border border-cyber-purple/40 text-cyber-purple text-[11px] font-mono shadow-lg hover:scale-105 transition duration-300">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
            <span>Giới thiệu</span>
        </button>
    </div>

    <audio id="bg-media" loop preload="auto">
        <source src="https://github.com/czasX/photo/raw/main/i%20will.mp4" type="video/mp4">
    </audio>

    <div class="fixed bottom-6 right-6 z-50">
        <button id="media-toggle-btn" onclick="toggleMedia()" 
                class="flex items-center gap-2 px-4 py-3 rounded-full glass-card border border-cyber-neon/40 text-cyber-neon text-xs font-mono shadow-lg hover:scale-105 transition duration-300">
            <i id="media-icon" data-lucide="volume-2" class="w-4 h-4"></i>
            <span id="media-text">Nhạc nền</span>
        </button>
    </div>

    <div id="app-container" class="relative z-10 max-w-4xl mx-auto px-4 py-12 md:py-20 flex flex-col items-center">
    </div>

    <script src="sonsixnhonixz.js"></script>
</body>
</html>
