<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModZ Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            900: '#020305',
                            800: '#070a14',
                            700: '#0f172a',
                            neon: '#00ffcc',
                            purple: '#9d00ff',
                            pink: '#ff007f'
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00ffcc33; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffcc; }
        .glass-card {
            background: rgba(7, 10, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.15);
        }
        .glass-card:hover {
            border-color: rgba(0, 255, 204, 0.5);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6), 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .not-found-box {
            border: 1px dashed rgba(255, 0, 127, 0.3);
            background: rgba(255, 0, 127, 0.03);
        }
        .entrance-hidden {
            opacity: 0;
            transform: translateY(30px);
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        #security-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #020305;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .console-log-box {
            background: rgba(2, 3, 5, 0.95);
            border: 1px solid rgba(0, 255, 204, 0.2);
            font-family: 'JetBrains Mono', monospace;
            max-height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-cyber-900 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyber-neon selection:text-cyber-900">

    <div id="security-gate">
        <div class="max-w-lg w-full mx-4 p-6 rounded-2xl glass-card border border-cyber-neon/40 relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-0 w-full h-1 bg-cyber-neon animate-pulse"></div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-cyber-neon/10 border border-cyber-neon/30 flex items-center justify-center text-cyber-neon">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-base font-bold text-white font-mono neon-glow">HỆ THỐNG PHÒNG THỦ ANTI-DDOS</h2>
                    <p class="text-[11px] text-slate-400 font-mono">Đang kiểm tra bảo mật thời gian thực (5 giây)...</p>
                </div>
            </div>

            <div class="console-log-box p-3 rounded-lg mb-4 text-[11px] space-y-1 text-slate-300" id="security-log-container">
            </div>

            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-3 border border-slate-700">
                <div id="security-progress" class="bg-cyber-neon h-full w-0 transition-all duration-300 shadow-[0_0_15px_#00ffcc]"></div>
            </div>
            <div class="flex justify-between items-center text-[10px] font-mono text-slate-500">
                <span id="security-status-text">Đang khởi tạo...</span>
                <span id="security-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="fixed top-4 right-4 z-40 flex items-center gap-3">
        <button onclick="scrollToSection('info-detailed-section')" 
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card border border-cyber-purple/40 text-cyber-purple text-[11px] font-mono shadow-lg hover:scale-105 transition duration-300">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
            <span>Giới thiệu</span>
        </button>
    </div>

    <audio id="bg-media" loop preload="auto">
        <source src="https://github.com/czasX/photo/raw/main/i%20will.mp4" type="video/mp4">
    </audio>

    <div class="fixed bottom-6 right-6 z-50">
        <button id="media-toggle-btn" onclick="toggleMedia()" 
                class="flex items-center gap-2 px-4 py-3 rounded-full glass-card border border-cyber-neon/40 text-cyber-neon text-xs font-mono shadow-lg hover:scale-105 transition duration-300">
            <i id="media-icon" data-lucide="volume-2" class="w-4 h-4"></i>
            <span id="media-text">Nhạc nền</span>
        </button>
    </div>

    <div id="app-container" class="relative z-10 max-w-4xl mx-auto px-4 py-12 md:py-20 flex flex-col items-center">
    </div>

    <script>
        const globalData = {
            profile: {
                name: "ModZ",
                title: "Trang thông tin tổng hợp liên kết",
                avatarUrl: "https://github.com/czasX/photo/raw/main/Idk.jpg",
                longBio: "Trang thông tin chính thức của ModZ. Nơi tổng hợp các liên kết mạng xã hội và kênh truyền thông cá nhân."
            },
            groups: [
                {
                    groupName: "Liên kết",
                    groupCode: "LINKS",
                    items: [
                        {
                            type: "discord",
                            title: "Nhóm Discord của baeminh",
                            info: "Tham gia máy chủ giao lưu và trò chuyện trực tuyến.",
                            url: "https://discord.gg/WkDWMVFV8"
                        },
                        {
                            type: "tiktok",
                            title: "Video ngắn",
                            info: "Xem các video ngắn mới nhất.",
                            url: "https://tiktok.com/vezipvz/"
                        }
                    ]
                }
            ]
        };

        function renderApp() {
            const container = document.getElementById('app-container');
            let html = '';

            html += `
                <div class="text-center mb-16 w-full entrance-hidden" id="profile-section">
                    <div class="relative w-36 h-36 mx-auto mb-6 group">
                        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-cyber-neon via-cyber-purple to-cyber-pink animate-spin-slow opacity-75 blur-sm group-hover:opacity-100 transition duration-500"></div>
                        <div class="relative w-full h-full rounded-full overflow-hidden border-2 border-cyber-neon/50 bg-cyber-800 p-1 flex items-center justify-center">
                            <img src="${globalData.profile.avatarUrl}" 
                                 alt="Avatar" 
                                 class="w-full h-full object-cover rounded-full grayscale group-hover:grayscale-0 transition duration-500"
                                 onerror="this.style.display='none'; document.getElementById('fallback-avatar').style.display='flex';">
                            <div id="fallback-avatar" class="absolute inset-0 hidden items-center justify-center bg-cyber-800 text-cyber-pink font-bold text-4xl select-none">✕</div>
                        </div>
                        <span class="absolute bottom-1 right-1 w-5 h-5 bg-cyber-neon border-2 border-cyber-900 rounded-full animate-pulse"></span>
                    </div>

                    <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-white mb-3 neon-glow">
                        ${globalData.profile.name}
                    </h1>
                    <p class="text-slate-300 font-mono text-sm md:text-base max-w-xl mx-auto mb-6">
                        ${globalData.profile.title}
                    </p>

                    <div id="info-detailed-section" class="p-6 rounded-2xl glass-card border border-cyber-neon/20 text-left max-w-2xl mx-auto relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-cyber-neon/5 rounded-full blur-2xl"></div>
                        <div class="flex items-center gap-2 text-xs font-mono text-cyber-neon mb-2">
                            <i data-lucide="info" class="w-4 h-4"></i>
                            <span>Giới thiệu</span>
                        </div>
                        <p class="text-xs md:text-sm text-slate-400 font-mono leading-relaxed">
                            ${globalData.profile.longBio}
                        </p>
                    </div>
                </div>
            `;

            globalData.groups.forEach((group, gIndex) => {
                html += `
                    <div class="w-full space-y-4 mb-16 entrance-hidden group-section" data-index="${gIndex}">
                        <div class="flex items-center justify-between mb-6 px-2">
                            <h2 class="text-xs font-mono tracking-widest text-cyber-neon uppercase flex items-center gap-2">
                                <i data-lucide="link" class="w-4 h-4"></i> ${group.groupName}
                            </h2>
                        </div>
                `;

                if (!group.items || group.items.length === 0) {
                    html += `
                        <div class="p-8 rounded-xl not-found-box text-center">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-cyber-pink/10 text-cyber-pink flex items-center justify-center text-xl font-bold">✕</div>
                            <h3 class="text-sm font-bold text-white font-mono mb-1">Không tìm thấy dữ liệu</h3>
                        </div>
                    `;
                } else {
                    html += `<div class="grid grid-cols-1 gap-4">`;
                    group.items.forEach(item => {
                        let iconName = 'external-link';
                        let accentColor = 'cyber-neon';
                        if(item.type === 'discord') { iconName = 'message-square'; accentColor = 'cyber-purple'; }
                        else if(item.type === 'tiktok') { iconName = 'video'; accentColor = 'cyber-pink'; }

                        html += `
                            <a href="${item.url}" target="_blank" 
                               class="group relative block p-5 rounded-xl glass-card transition-all duration-300 hover:-translate-y-1 hover:border-${accentColor}">
                                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                    <div class="flex items-start gap-4">
                                        <div class="w-12 h-12 rounded-lg bg-${accentColor}/10 text-${accentColor} flex items-center justify-center shrink-0 relative overflow-hidden group-hover:bg-${accentColor} group-hover:text-cyber-900 transition duration-300">
                                            <i data-lucide="${iconName}" class="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                                <h3 class="font-bold text-base text-white group-hover:text-${accentColor} transition">${item.title}</h3>
                                            </div>
                                            <p class="text-xs text-slate-400 font-mono leading-relaxed">${item.info}</p>
                                        </div>
                                    </div>
                                    <div class="p-2 rounded-lg bg-white/5 text-slate-400 group-hover:text-${accentColor} group-hover:translate-x-1 transition duration-300 self-end sm:self-center shrink-0">
                                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                                    </div>
                                </div>
                            </a>
                        `;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });

            container.innerHTML = html;
            lucide.createIcons();
            runEntranceAnimations();
        }

        function scrollToSection(id) {
            const el = document.getElementById(id);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                gsap.fromTo(el, { borderColor: '#00ffcc' }, { borderColor: 'rgba(0, 255, 204, 0.2)', duration: 1.5 });
            }
        }

        function runEntranceAnimations() {
            gsap.registerPlugin(ScrollTrigger);
            gsap.to('#profile-section', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' });
            gsap.utils.toArray('.group-section').forEach((sec) => {
                gsap.to(sec, {
                    scrollTrigger: { trigger: sec, start: 'top 85%' },
                    opacity: 1, y: 0, duration: 0.6, ease: 'power2.out'
                });
            });
        }

        function initPureSpace() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 50);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const starCount = 4000;
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(starCount * 3);
            const starColors = new Float32Array(starCount * 3);

            const palette = [
                new THREE.Color(0xffffff),
                new THREE.Color(0x88ccff),
                new THREE.Color(0xffaa55),
                new THREE.Color(0xcc66ff)
            ];

            for (let i = 0; i < starCount * 3; i += 3) {
                starPos[i] = (Math.random() - 0.5) * 1000;
                starPos[i + 1] = (Math.random() - 0.5) * 1000;
                starPos[i + 2] = (Math.random() - 0.5) * 1000;

                const col = palette[Math.floor(Math.random() * palette.length)];
                starColors[i] = col.r;
                starColors[i + 1] = col.g;
                starColors[i + 2] = col.b;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

            const starMat = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            const starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);

            let clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();

                starField.rotation.y = time * 0.01;
                starField.rotation.x = time * 0.005;

                camera.position.x = Math.sin(time * 0.04) * 4;
                camera.position.y = Math.cos(time * 0.04) * 4;

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function runAntiDDoSVerification() {
            const progress = document.getElementById('security-progress');
            const percent = document.getElementById('security-percent');
            const statusText = document.getElementById('security-status-text');
            const gate = document.getElementById('security-gate');
            const logBox = document.getElementById('security-log-container');

            let startTime = Date.now();
            const totalDuration = 5000;

            const pipelineLogs = [
                { time: 400, msg: "[CLIENT] -> Khởi tạo kết nối bảo mật TLS tunnel." },
                { time: 1000, msg: "[DNS / CDN] -> Đang lọc lưu lượng L3/L4 & giới hạn tốc độ." },
                { time: 1800, msg: "[WAF] -> Kiểm tra danh tiếng IP & bộ lọc yêu cầu." },
                { time: 2600, msg: "[ANTI-BOT] -> Xác thực dấu vân tay trình duyệt thành công." },
                { time: 3400, msg: "[RATE LIMITER] -> Kiểm tra giới hạn phiên làm việc theo thời gian thực." },
                { time: 4200, msg: "[APPLICATION] -> Kích hoạt bảo vệ xác thực & cơ sở dữ liệu." },
                { time: 4800, msg: "[MONITORING] -> Trạng thái hệ thống an toàn. Đã sẵn sàng." }
            ];

            let loggedIndices = new Set();

            const checkInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let currentProgress = Math.min(100, Math.floor((elapsed / totalDuration) * 100));

                progress.style.width = currentProgress + '%';
                percent.textContent = currentProgress + '%';

                pipelineLogs.forEach((item, idx) => {
                    if (elapsed >= item.time && !loggedIndices.has(idx)) {
                        loggedIndices.add(idx);
                        const logItem = document.createElement('div');
                        logItem.className = "text-cyber-neon/90 font-mono text-[10px]";
                        logItem.textContent = `> ${item.msg}`;
                        logBox.appendChild(logItem);
                        logBox.scrollTop = logBox.scrollHeight;
                        statusText.textContent = item.msg;
                    }
                });

                if (currentProgress >= 100) {
                    clearInterval(checkInterval);
                    setTimeout(() => {
                        gsap.to(gate, {
                            opacity: 0,
                            duration: 0.6,
                            onComplete: () => {
                                gate.style.display = 'none';
                                renderApp();
                                initPureSpace();
                                initAudioPlayback();
                            }
                        });
                    }, 300);
                }
            }, 50);
        }

        let isPlaying = true;
        function toggleMedia() {
            const media = document.getElementById('bg-media');
            const mediaText = document.getElementById('media-text');
            const mediaIcon = document.getElementById('media-icon');

            isPlaying = !isPlaying;
            if (isPlaying) {
                media.play().catch(() => {});
                mediaText.textContent = "Đang phát nhạc";
                mediaIcon.setAttribute('data-lucide', 'volume-2');
            } else {
                media.pause();
                mediaText.textContent = "Đã tắt nhạc";
                mediaIcon.setAttribute('data-lucide', 'volume-x');
            }
            lucide.createIcons();
        }

        function initAudioPlayback() {
            setTimeout(() => {
                const media = document.getElementById('bg-media');
                media.play().then(() => {
                    isPlaying = true;
                    document.getElementById('media-text').textContent = "Đang phát nhạc";
                    document.getElementById('media-icon').setAttribute('data-lucide', 'volume-2');
                    lucide.createIcons();
                }).catch(() => {
                    const unlockAudio = () => {
                        media.play().then(() => {
                            isPlaying = true;
                            document.getElementById('media-text').textContent = "Đang phát nhạc";
                            document.getElementById('media-icon').setAttribute('data-lucide', 'volume-2');
                            lucide.createIcons();
                            window.removeEventListener('click', unlockAudio);
                            window.removeEventListener('touchstart', unlockAudio);
                        }).catch(() => {});
                    };
                    window.addEventListener('click', unlockAudio);
                    window.addEventListener('touchstart', unlockAudio);

                    isPlaying = false;
                    document.getElementById('media-text').textContent = "Bật nhạc nền";
                    document.getElementById('media-icon').setAttribute('data-lucide', 'volume-x');
                    lucide.createIcons();
                });
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            runAntiDDoSVerification();
        });
    </script>
</body>
</html>
